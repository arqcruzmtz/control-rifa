<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Control de Rifa - Lotería Mexicana</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #25d366;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1rem; min-height: 100vh; }
    
    header {
      display: flex; flex-direction: column; gap: 0.85rem; max-width: 1400px;
      margin: 0 auto 1.25rem auto; padding-bottom: 1rem; border-bottom: 1px solid #334155;
    }
    @media (min-width: 768px) {
      header { flex-direction: row; justify-content: space-between; align-items: center; }
    }
    .header-left h1 { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    .header-left p { color: #94a3b8; font-size: 0.85rem; margin-top: 0.2rem; }
    
    .header-controls { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    .stats-bar {
      display: flex; gap: 0.8rem; align-items: center; background: #1e293b;
      padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid #334155; font-size: 0.9rem;
    }
    .stat-badge { font-weight: 800; font-size: 1.05rem; }
    .stat-sold { color: #f87171; }
    .stat-free { color: #38bdf8; }
    
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; width: 100%; }
    @media (min-width: 768px) { .actions { width: auto; } }
    
    button {
      cursor: pointer; border: none; outline: none; font-weight: 800; font-size: 0.95rem;
      padding: 0.75rem 1.2rem; border-radius: 10px; transition: 0.15s ease; display: inline-flex;
      align-items: center; justify-content: center; gap: 0.5rem;
    }
    button:active { transform: scale(0.97); }
    
    /* WhatsApp Share Button */
    .btn-whatsapp {
      background: #25d366; color: #042f1a; flex: 1; min-width: 200px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35); font-size: 1rem;
    }
    .btn-whatsapp:hover { background: #22bf5b; }
    
    .btn-download { background: #334155; color: #f1f5f9; }
    .btn-download:hover { background: #475569; }
    
    .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; color: white; }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; right: 20px; background: #059669; color: white;
      padding: 12px 20px; border-radius: 10px; font-weight: 800; font-size: 0.95rem;
      box-shadow: 0 10px 20px -3px rgba(0,0,0,0.6); z-index: 200;
      opacity: 0; transform: translateY(10px); transition: 0.25s ease; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (min-width: 640px) {
      .grid-container { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    }
    @media (min-width: 1024px) {
      .grid-container { grid-template-columns: repeat(9, 1fr); }
    }
    .card-item {
      background: #ffffff; border-radius: 8px; padding: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer; position: relative; overflow: hidden; aspect-ratio: 1 / 1.58;
      display: flex; flex-direction: column; transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }
    .card-item:hover { transform: translateY(-3px); box-shadow: 0 10px 16px rgba(0,0,0,0.5); }
    .card-img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; }
    
    /* Overlay for sold cards */
    .card-item.sold::before {
      content: ''; position: absolute; inset: 4px; background: rgba(10, 16, 26, 0.65);
      border-radius: 4px; z-index: 2;
    }
    .sold-badge {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #dc2626; color: #ffffff; font-weight: 900;
      font-size: 0.95rem; line-height: 1.2; text-transform: uppercase;
      padding: 10px 6px; border-radius: 8px; z-index: 3; text-align: center; width: 90%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6); border: 2px solid #ffffff;
      word-break: break-word; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .card-item.sold .sold-badge { display: block; }

    /* Modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: #1e293b; border: 1px solid #475569; border-radius: 14px;
      padding: 1.5rem; width: 92%; max-width: 390px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }
    .modal-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.25rem; color: #f8fafc; }
    .modal-sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.25rem; }
    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #e2e8f0; }
    .input-group input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 2px solid #475569;
      background: #0f172a; color: white; font-size: 1.15rem; font-weight: 700;
      text-transform: uppercase;
    }
    .input-group input:focus { border-color: #38bdf8; outline: none; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 0.5rem; }
    .btn-danger { background: #b91c1c; color: white; margin-right: auto; }
    .btn-danger:hover { background: #991b1b; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
  </style>
  <script src="cards.js"></script>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>🎲 Rifa Lotería Mexicana</h1>
      <p>Tocá cualquier carta para anotar quién la compró o liberarla.</p>
    </div>
    
    <div class="header-controls">
      <div class="stats-bar">
        <span>Vendidas: <span id="sold-count" class="stat-badge stat-sold">0</span></span>
        <span style="color:#64748b;">|</span>
        <span>Libres: <span id="free-count" class="stat-badge stat-free">54</span></span>
      </div>
      
      <div class="actions">
        <button class="btn-whatsapp" id="btn-share" onclick="shareOrDownload('share')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.45 0-2.87-.38-4.12-1.11l-.3-.17-3.12.82.83-3.04-.19-.31a8.21 8.21 0 0 1-1.26-4.43c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/>
          </svg>
          Compartir por WhatsApp (HD)
        </button>
        <button class="btn-download" id="btn-dl" onclick="shareOrDownload('download')">📥 Guardar Imagen</button>
        <button class="btn-secondary" onclick="exportBackup()">💾 Respaldo</button>
      </div>
    </div>
  </header>

  <div class="grid-container" id="grid"></div>

  <!-- Toast -->
  <div id="toast">✓ Guardado</div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-title" id="m-card-title">#1 El Gallo</div>
      <div class="modal-sub">Escribí el nombre del comprador:</div>
      <div class="input-group">
        <label for="buyer-input">NOMBRE:</label>
        <input type="text" id="buyer-input" placeholder="Ej. LULÚ, PILY..." autocomplete="off">
      </div>
      <div class="modal-btns">
        <button type="button" class="btn-danger" id="btn-clear" onclick="clearCurrentCard()">Liberar</button>
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button type="button" class="btn-primary" onclick="saveCurrentCard()">Guardar</button>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script>
    const CARD_NAMES = [
      "El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", "La Sirena", "La Escalera", "La Botella", "El Barril",
      "El Árbol", "El Melón", "El Valiente", "El Gorrito", "La Muerte", "La Pera", "La Bandera", "El Bandolón", "El Violoncello",
      "La Garza", "El Pájaro", "La Mano", "La Bota", "La Luna", "El Cotorro", "El Borracho", "El Negrito", "El Corazón",
      "La Sandía", "El Tambor", "El Camarón", "Las Jaras", "El Músico", "La Araña", "El Soldado", "La Estrella", "El Cazo",
      "El Mundo", "El Apache", "El Nopal", "El Alacrán", "La Rosa", "La Calavera", "La Campana", "El Cantarito", "El Venado",
      "El Sol", "La Corona", "La Chalupa", "El Pino", "El Pescado", "La Palma", "La Maceta", "El Arpa", "La Rana"
    ];

    const INITIAL_PURCHASES = {
      1: 'Lulú', 3: 'Ely', 4: 'Pily', 5: 'Pily', 6: 'Liz', 7: 'Yolita',
      12: 'Pablo', 14: 'Pily', 16: 'Pily', 18: 'Pily', 22: 'Marilú', 23: 'Zury',
      25: 'Pily', 27: 'Candy', 30: 'Pily', 34: 'Yolita', 35: 'Lupita', 41: 'Lulú',
      46: 'Pily', 47: 'Inés', 48: 'Inés', 50: 'Nayely', 52: 'Pily'
    };

    let sales = {};
    let activeCardIndex = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function init() {
      try {
        const stored = localStorage.getItem('loteria_rifa_ventas_v2');
        if (stored) {
          sales = JSON.parse(stored);
        } else {
          sales = {...INITIAL_PURCHASES};
          localStorage.setItem('loteria_rifa_ventas_v2', JSON.stringify(sales));
        }
      } catch (e) {
        sales = {...INITIAL_PURCHASES};
      }
      renderGrid();
    }

    function saveToStorage() {
      try {
        localStorage.setItem('loteria_rifa_ventas_v2', JSON.stringify(sales));
        showToast('✓ Guardado automáticamente');
      } catch (e) {
        console.error('Error saving:', e);
      }
      updateStats();
    }

    function updateStats() {
      const sold = Object.keys(sales).length;
      document.getElementById('sold-count').innerText = sold;
      document.getElementById('free-count').innerText = 54 - sold;
    }

    function renderGrid() {
      const container = document.getElementById('grid');
      container.innerHTML = '';
      for (let i = 1; i <= 54; i++) {
        const item = document.createElement('div');
        const buyer = sales[i];
        item.className = 'card-item' + (buyer ? ' sold' : '');
        item.onclick = () => openModal(i);

        const imgSrc = (typeof CARDS_DATA !== 'undefined' && CARDS_DATA[i]) ? CARDS_DATA[i] : `cards/${i}.webp`;

        item.innerHTML = `
          <img class="card-img" src="${imgSrc}" alt="${CARD_NAMES[i-1]}">
          <div class="sold-badge">${buyer || ''}</div>
        `;
        container.appendChild(item);
      }
      updateStats();
    }

    function openModal(cardNum) {
      activeCardIndex = cardNum;
      document.getElementById('m-card-title').innerText = `#${cardNum} ${CARD_NAMES[cardNum - 1]}`;
      const input = document.getElementById('buyer-input');
      input.value = sales[cardNum] || '';
      document.getElementById('modal').classList.add('active');
      setTimeout(() => {
        input.focus();
        input.select();
      }, 50);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      activeCardIndex = null;
    }

    function saveCurrentCard() {
      if (!activeCardIndex) return;
      const val = document.getElementById('buyer-input').value.trim();
      if (val) {
        sales[activeCardIndex] = val;
      } else {
        delete sales[activeCardIndex];
      }
      saveToStorage();
      renderGrid();
      closeModal();
    }

    function clearCurrentCard() {
      if (!activeCardIndex) return;
      delete sales[activeCardIndex];
      saveToStorage();
      renderGrid();
      closeModal();
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sales, null, 2));
      const dl = document.createElement('a');
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", `respaldo_rifa_${new Date().toISOString().slice(0,10)}.json`);
      dl.click();
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    async function generateBoardBlob() {
      const COLS = 9, ROWS = 6;
      const INNER_W = 600, INNER_H = 952;
      const BORDER_X = 36, BORDER_Y = 36;
      const CARD_W = INNER_W + 2 * BORDER_X;
      const CARD_H = INNER_H + 2 * BORDER_Y;
      const GAP_X = 36, GAP_Y = 36;
      const PAD_X = 70, PAD_Y = 70;

      const TOTAL_W = PAD_X * 2 + COLS * CARD_W + (COLS - 1) * GAP_X;
      const TOTAL_H = PAD_Y * 2 + ROWS * CARD_H + (ROWS - 1) * GAP_Y;

      const canvas = document.getElementById('exportCanvas');
      canvas.width = TOTAL_W;
      canvas.height = TOTAL_H;
      const ctx = canvas.getContext('2d');

      // Rustic warm wood background
      ctx.fillStyle = '#e1ddd7';
      ctx.fillRect(0, 0, TOTAL_W, TOTAL_H);
      for (let x = 0; x < TOTAL_W; x += 260) {
        ctx.strokeStyle = '#d0cbc4';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, TOTAL_H); ctx.stroke();
        ctx.strokeStyle = '#eeebe6';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x + 1, 0); ctx.lineTo(x + 1, TOTAL_H); ctx.stroke();
      }

      // Preload images
      const images = await Promise.all(
        Array.from({length: 54}, (_, idx) => {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => resolve(img);
            img.src = (typeof CARDS_DATA !== 'undefined' && CARDS_DATA[idx + 1]) ? CARDS_DATA[idx + 1] : `cards/${idx + 1}.webp`;
          });
        })
      );

      // Render cards
      for (let i = 1; i <= 54; i++) {
        const idx = i - 1;
        const col = idx % COLS;
        const row = Math.floor(idx / COLS);
        const x = PAD_X + col * (CARD_W + GAP_X);
        const y = PAD_Y + row * (CARD_H + GAP_Y);

        // Card Drop Shadow
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetX = 4;
        ctx.shadowOffsetY = 6;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, CARD_W, CARD_H);
        ctx.restore();

        // Card border definition
        ctx.strokeStyle = '#c8c8c8';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, CARD_W, CARD_H);

        // Art
        if (images[idx] && images[idx].complete && images[idx].naturalWidth > 0) {
          ctx.drawImage(images[idx], x + BORDER_X, y + BORDER_Y, INNER_W, INNER_H);
        }

        // Sold Overlay
        if (sales[i]) {
          const buyer = sales[i].toUpperCase();

          ctx.fillStyle = 'rgba(10, 16, 26, 0.60)';
          ctx.fillRect(x + BORDER_X, y + BORDER_Y, INNER_W, INNER_H);

          const bw = 550, bh = 175;
          const bx = x + (CARD_W - bw) / 2;
          const by = y + (CARD_H - bh) / 2;

          ctx.save();
          ctx.fillStyle = 'rgba(220, 38, 38, 0.96)';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          drawRoundedRect(ctx, bx, by, bw, bh, 30);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0,0,0,0.7)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetX = 3;
          ctx.shadowOffsetY = 3;

          let fontSize = 78;
          if (buyer.length > 6) fontSize = 64;
          if (buyer.length > 9) fontSize = 52;
          if (buyer.length > 12) fontSize = 42;

          ctx.font = `900 ${fontSize}px system-ui, -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(buyer, bx + bw / 2, by + bh / 2);
          ctx.restore();
        }
      }

      return new Promise((resolve) => {
        canvas.toBlob(resolve, 'image/jpeg', 0.95);
      });
    }

    async function shareOrDownload(action = 'share') {
      const btnShare = document.getElementById('btn-share');
      const btnDl = document.getElementById('btn-dl');
      const activeBtn = action === 'share' ? btnShare : btnDl;
      const origText = activeBtn.innerHTML;
      
      activeBtn.innerHTML = '⏳ Preparando HD...';
      activeBtn.disabled = true;

      try {
        const blob = await generateBoardBlob();
        if (!blob) throw new Error('No se pudo generar la imagen.');
        
        const filename = `loteria_rifa_${new Date().toISOString().slice(0,10)}.jpg`;
        const file = new File([blob], filename, { type: 'image/jpeg' });

        if (action === 'share' && navigator.canShare && navigator.canShare({ files: [file] })) {
          // Native Share Sheet (opens WhatsApp, Telegram, etc.)
          await navigator.share({
            files: [file],
            title: 'Rifa Lotería Mexicana',
            text: '🎲 ¡Tablero actualizado de la Lotería Mexicana!'
          });
          showToast('✓ Compartido');
        } else {
          // Direct file download fallback
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.download = filename;
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('✓ Imagen guardada en tu dispositivo');
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error(err);
          alert('Aviso: ' + err.message);
        }
      } finally {
        activeBtn.innerHTML = origText;
        activeBtn.disabled = false;
      }
    }

    document.getElementById('buyer-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveCurrentCard();
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
